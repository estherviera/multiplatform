openapi: 3.0.3
info:
  title: Nexora SaaS API
  version: 0.3.0-alpha
  description: >
    Contrato OpenAPI del backend Ktor SaaS de Nexora (Fase 1 + Fase 2C.1).
    Incluye salud operativa, autenticación JWT asimétrica mediante Supabase Auth/JWKS,
    gestión idempotente del propio perfil y consultas multiempresa protegidas por RLS.
    La creación global de empresas, invitaciones, cambios de roles y módulos educativos
    se añadirán en incrementos posteriores.
servers:
  - url: http://127.0.0.1:8080
    description: Entorno local de desarrollo Ktor SaaS
tags:
  - name: Health
    description: Comprobaciones operativas de liveness y readiness
  - name: Identity
    description: Verificación de identidad autenticada mediante JWT de Supabase Auth
  - name: Profiles
    description: Consulta y gestión idempotente del perfil propio del usuario autenticado
  - name: Companies
    description: Consultas multiempresa y membresías visibles según RLS
paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Comprobación pública mínima de liveness
      operationId: getLiveness
      responses:
        '200':
          description: Servicio activo
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags:
        - Health
      summary: Comprobación operativa de readiness
      operationId: getReadiness
      security:
        - {}
        - ReadinessToken: []
      responses:
        '200':
          description: Servicio listo para recibir tráfico
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Servicio no listo (uno o más checks fallaron)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/auth/me:
    get:
      tags:
        - Identity
      summary: Devuelve la identidad verificada del usuario autenticado
      operationId: getAuthenticatedIdentity
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identidad verificada correctamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/me/profile:
    get:
      tags:
        - Profiles
      summary: Consulta el perfil propio del usuario autenticado
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    put:
      tags:
        - Profiles
      summary: Crea de forma idempotente o actualiza el perfil propio
      description: >
        Vincula siempre el perfil al UUID `sub` verificado en el JWT.
        Rechaza campos adicionales no permitidos y valida longitud y formato de los campos editables.
      operationId: upsertMyProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileRequest'
      responses:
        '200':
          description: Perfil creado o actualizado correctamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: La identidad autenticada no es elegible para aprovisionar perfil
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/me/companies:
    get:
      tags:
        - Companies
      summary: Lista paginada de empresas activas donde el usuario es miembro activo
      operationId: listMyCompanies
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Listado paginado de empresas activas del usuario con su rol
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserCompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}:
    get:
      tags:
        - Companies
      summary: Consulta el detalle de una empresa activa a la que pertenece el usuario
      description: Devuelve 404 uniforme si la empresa no existe, está suspendida o el usuario no es miembro activo.
      operationId: getCompanyById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Detalle de la empresa activa
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/membership:
    get:
      tags:
        - Companies
      summary: Consulta la membresía activa propia del usuario en una empresa
      description: Devuelve 404 uniforme si la empresa no existe, está suspendida o el usuario no es miembro activo.
      operationId: getMyCompanyMembership
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Membresía activa del usuario en la empresa
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/memberships:
    get:
      tags:
        - Companies
      summary: Lista paginada de membresías visibles según RLS en una empresa activa
      description: >
        Un `company_admin` activo visualiza todas las membresías de su empresa (sin datos de `profiles`).
        Un `trainer` o `member` activo visualiza únicamente su propia membresía activa conforme a RLS.
        Devuelve 404 uniforme para empresas ajenas, inexistentes o suspendidas y usuarios sin membresía activa.
      operationId: listCompanyMemberships
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Listado paginado de membresías visibles según el rol del usuario
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT asimétrico (p.ej. ES256) emitido por Supabase Auth.
    ReadinessToken:
      type: apiKey
      in: header
      name: X-Nexora-Readiness-Token
      description: Token operativo para proteger /health/ready en entornos restringidos.
  parameters:
    CompanyIdPath:
      name: companyId
      in: path
      required: true
      description: UUID canónico de la empresa.
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      required: false
      description: Tamaño máximo de página (1..100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageOffset:
      name: offset
      in: query
      required: false
      description: Desplazamiento de paginación (0..10000).
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
  headers:
    XRequestId:
      description: Identificador de correlación de la solicitud HTTP.
      schema:
        type: string
    NoStoreCacheControl:
      description: Impide el almacenamiento en caché de datos privados.
      schema:
        type: string
        enum:
          - no-store
  responses:
    BadRequestError:
      description: Solicitud inválida o error de validación
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Autenticación ausente, inválida o expirada
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Recurso no encontrado o no accesible
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailableError:
      description: Servicio temporalmente no disponible (fallo cerrado)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LivenessResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - environment
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        service:
          type: string
        environment:
          type: string
          enum:
            - local
            - test
            - staging
            - production
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - not_ready
    IdentityResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - issuer
        - audience
        - expiresAt
      properties:
        userId:
          type: string
          format: uuid
        issuer:
          type: string
        audience:
          type: string
        sessionId:
          type: string
          format: uuid
          nullable: true
        aal:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
    UpsertProfileRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        avatarPath:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
    ProfileResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarPath:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CompanyResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserCompanyResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - status
        - role
        - membershipStatus
        - joinedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        role:
          type: string
          enum:
            - company_admin
            - trainer
            - member
        membershipStatus:
          type: string
          enum:
            - invited
            - active
            - suspended
        joinedAt:
          type: string
          format: date-time
    MembershipResponse:
      type: object
      additionalProperties: false
      required:
        - companyId
        - userId
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        companyId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - company_admin
            - trainer
            - member
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PagedUserCompanyResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserCompanyResponse'
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    PagedMembershipResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipResponse'
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          nullable: true
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
