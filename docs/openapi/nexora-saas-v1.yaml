openapi: 3.0.3
info:
  title: Nexora SaaS API
  version: 0.5.0-alpha
  description: >
    Contrato OpenAPI del backend Ktor SaaS de Nexora (Fase 1 + Fases 2C.1, 2C.2, 2C.3A, 2C.3B, 2C.3C y auditoría integral 2D).
    Incluye salud operativa, autenticación JWT asimétrica mediante Supabase Auth/JWKS,
    gestión idempotente del propio perfil, consultas multiempresa, gestión segura de
    invitaciones, roles, suspensiones y sustitución atómica de administradores protegida
    por RLS y auditoría durable, y creación atómica e idempotente de empresas por el
    administrador global verificado mediante MFA `aal2` reciente y ejecutor SQL dedicado `app_platform`.
    Los módulos educativos se añadirán posteriormente.
servers:
  - url: http://127.0.0.1:8080
    description: Entorno local de desarrollo Ktor SaaS
tags:
  - name: Health
    description: Comprobaciones operativas de liveness y readiness
  - name: Identity
    description: Verificación de identidad autenticada mediante JWT de Supabase Auth
  - name: Profiles
    description: Consulta y gestión idempotente del perfil propio del usuario autenticado
  - name: Companies
    description: Consultas multiempresa y membresías visibles según RLS
  - name: Invitations
    description: Invitaciones empresariales y aceptación/rechazo por su destinatario
  - name: MembershipAdmin
    description: Gestión administrativa de roles, suspensiones y sustitución atómica de administradores
  - name: PlatformAdmin
    description: Operaciones de plataforma restringidas al administrador global verificado con MFA reciente y ejecutor SQL dedicado
paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Comprobación pública mínima de liveness
      operationId: getLiveness
      responses:
        '200':
          description: Servicio activo
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /health/ready:
    get:
      tags:
        - Health
      summary: Comprobación operativa de readiness
      operationId: getReadiness
      security:
        - {}
        - ReadinessToken: []
      responses:
        '200':
          description: Servicio listo para recibir tráfico
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          description: Servicio no listo (uno o más checks fallaron)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/auth/me:
    get:
      tags:
        - Identity
      summary: Devuelve la identidad verificada del usuario autenticado
      operationId: getAuthenticatedIdentity
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Identidad verificada correctamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/me/profile:
    get:
      tags:
        - Profiles
      summary: Consulta el perfil propio del usuario autenticado
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    put:
      tags:
        - Profiles
      summary: Crea de forma idempotente o actualiza el perfil propio
      description: >
        Vincula siempre el perfil al UUID `sub` verificado en el JWT.
        Rechaza campos adicionales no permitidos y valida longitud y formato de los campos editables.
      operationId: upsertMyProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProfileRequest'
      responses:
        '200':
          description: Perfil creado o actualizado correctamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '409':
          description: La identidad autenticada no es elegible para aprovisionar perfil
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/me/companies:
    get:
      tags:
        - Companies
      summary: Lista paginada de empresas activas donde el usuario es miembro activo
      operationId: listMyCompanies
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Listado paginado de empresas activas del usuario con su rol
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserCompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}:
    get:
      tags:
        - Companies
      summary: Consulta el detalle de una empresa activa a la que pertenece el usuario
      description: Devuelve 404 uniforme si la empresa no existe, está suspendida o el usuario no es miembro activo.
      operationId: getCompanyById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Detalle de la empresa activa
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/membership:
    get:
      tags:
        - Companies
      summary: Consulta la membresía activa propia del usuario en una empresa
      description: Devuelve 404 uniforme si la empresa no existe, está suspendida o el usuario no es miembro activo.
      operationId: getMyCompanyMembership
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      responses:
        '200':
          description: Membresía activa del usuario en la empresa
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/memberships:
    get:
      tags:
        - Companies
      summary: Lista paginada de membresías visibles según RLS en una empresa activa
      description: >
        Un `company_admin` activo visualiza todas las membresías de su empresa (sin datos de `profiles`).
        Un `trainer` o `member` activo visualiza únicamente su propia membresía activa conforme a RLS.
        Devuelve 404 uniforme para empresas ajenas, inexistentes o suspendidas y usuarios sin membresía activa.
      operationId: listCompanyMemberships
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Listado paginado de membresías visibles según el rol del usuario
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/invitations:
    post:
      tags:
        - Invitations
      summary: Crea una invitación idempotente para un usuario elegible
      operationId: createCompanyInvitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitación creada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '200':
          description: Reintento idempotente sobre invitación pendiente idéntica
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
    get:
      tags:
        - Invitations
      summary: Lista paginada de invitaciones de la empresa (solo company_admin activo)
      operationId: listCompanyInvitations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Invitaciones de la empresa
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/me/invitations:
    get:
      tags:
        - Invitations
      summary: Lista paginada de invitaciones dirigidas al usuario autenticado
      operationId: listMyInvitations
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Invitaciones del usuario autenticado
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedInvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/me/invitations/{invitationId}:
    get:
      tags:
        - Invitations
      summary: Consulta una invitación dirigida al usuario autenticado
      operationId: getMyInvitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationIdPath'
      responses:
        '200':
          description: Detalle de la invitación
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/me/invitations/{invitationId}/accept:
    post:
      tags:
        - Invitations
      summary: Acepta de forma atómica e idempotente una invitación pendiente
      operationId: acceptMyInvitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationIdPath'
      responses:
        '200':
          description: Membresía activada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/me/invitations/{invitationId}/decline:
    post:
      tags:
        - Invitations
      summary: Rechaza de forma explícita e idempotente una invitación pendiente
      operationId: declineMyInvitation
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationIdPath'
      responses:
        '200':
          description: Invitación rechazada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/memberships/{userId}/role:
    patch:
      tags:
        - MembershipAdmin
      summary: Cambia el rol de una membresía existente (solo company_admin activo)
      operationId: changeCompanyMemberRole
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Rol actualizado
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/memberships/{userId}/suspend:
    post:
      tags:
        - MembershipAdmin
      summary: Suspende una membresía activa (impide dejar la empresa sin administrador activo)
      operationId: suspendCompanyMember
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Membresía suspendida
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/memberships/{userId}/reactivate:
    post:
      tags:
        - MembershipAdmin
      summary: Reactiva una membresía suspendida
      operationId: reactivateCompanyMember
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Membresía reactivada
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/companies/{companyId}/admins/replace:
    post:
      tags:
        - MembershipAdmin
      summary: Sustituye atómicamente a un administrador activo promoviendo a un sucesor activo
      operationId: replaceCompanyAdmin
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CompanyIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceAdminRequest'
      responses:
        '200':
          description: Administrador sustituido atómicamente
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplaceAdminResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
  /api/v1/platform/companies:
    post:
      tags:
        - PlatformAdmin
      summary: Crea una empresa activa y asigna atómicamente su primer company_admin
      description: >
        Operación exclusiva del administrador global de plataforma configurado en servidor
        (`NEXORA_GLOBAL_ADMIN_SUB`). Exige JWT asimétrico válido, sesión viva verificada en
        Supabase Auth (`GET /user`), MFA `aal2` con desafío reciente en `amr` (nunca `iat`),
        clave de idempotencia obligatoria (`Idempotency-Key`) y ejecutor SQL dedicado `app_platform`.
        Permanece deshabilitada por defecto si falta la configuración global.
      operationId: createPlatformCompany
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformCreateCompanyRequest'
      responses:
        '201':
          description: Empresa y primer administrador creados atómicamente con auditoría durable
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformCreateCompanyResponse'
        '200':
          description: Repetición idempotente con la misma clave y solicitud canónica
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStoreCacheControl'
            X-Idempotency-Replayed:
              $ref: '#/components/headers/XIdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformCreateCompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '503':
          $ref: '#/components/responses/ServiceUnavailableError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT asimétrico (p.ej. ES256) emitido por Supabase Auth.
    ReadinessToken:
      type: apiKey
      in: header
      name: X-Nexora-Readiness-Token
      description: Token operativo para proteger /health/ready en entornos restringidos.
  parameters:
    CompanyIdPath:
      name: companyId
      in: path
      required: true
      description: UUID canónico de la empresa.
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      description: UUID canónico del usuario objetivo.
      schema:
        type: string
        format: uuid
    InvitationIdPath:
      name: invitationId
      in: path
      required: true
      description: UUID canónico de la invitación.
      schema:
        type: string
        format: uuid
    PageLimit:
      name: limit
      in: query
      required: false
      description: Tamaño máximo de página (1..100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    PageOffset:
      name: offset
      in: query
      required: false
      description: Desplazamiento de paginación (0..10000).
      schema:
        type: integer
        minimum: 0
        maximum: 10000
        default: 0
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave de idempotencia no sensible (1..128 caracteres `[A-Za-z0-9._:-]`).
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
  headers:
    XRequestId:
      description: Identificador de correlación de la solicitud HTTP.
      schema:
        type: string
    NoStoreCacheControl:
      description: Impide el almacenamiento en caché de datos privados.
      schema:
        type: string
        enum:
          - no-store
    XIdempotencyReplayed:
      description: Presente con valor `true` cuando se devuelve el resultado almacenado de una repetición idempotente.
      schema:
        type: string
        enum:
          - 'true'
    RetryAfterSeconds:
      description: Segundos sugeridos antes de reintentar tras superar el límite de solicitudes.
      schema:
        type: integer
        minimum: 1
  responses:
    BadRequestError:
      description: Solicitud inválida o error de validación
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Autenticación ausente, inválida o expirada
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ForbiddenError:
      description: El actor autenticado carece del rol requerido en este ámbito
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictError:
      description: Conflicto de estado o regla de negocio (p.ej. último administrador activo)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundError:
      description: Recurso no encontrado o no accesible
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailableError:
      description: Servicio temporalmente no disponible (fallo cerrado)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequestsError:
      description: Límite de solicitudes excedido para operaciones de plataforma
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfterSeconds'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLargeError:
      description: Cuerpo de solicitud excede el tamaño máximo permitido
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaTypeError:
      description: Tipo de contenido no soportado (se requiere application/json)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LivenessResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - environment
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        service:
          type: string
        environment:
          type: string
          enum:
            - local
            - test
            - staging
            - production
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - not_ready
    IdentityResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - issuer
        - audience
        - expiresAt
      properties:
        userId:
          type: string
          format: uuid
        issuer:
          type: string
        audience:
          type: string
        sessionId:
          type: string
          format: uuid
          nullable: true
        aal:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
    UpsertProfileRequest:
      type: object
      additionalProperties: false
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        avatarPath:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
    ProfileResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarPath:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CompanyResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserCompanyResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - name
        - status
        - role
        - membershipStatus
        - joinedAt
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - suspended
        role:
          type: string
          enum:
            - company_admin
            - trainer
            - member
        membershipStatus:
          type: string
          enum:
            - invited
            - active
            - suspended
        joinedAt:
          type: string
          format: date-time
    MembershipResponse:
      type: object
      additionalProperties: false
      required:
        - companyId
        - userId
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        companyId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - company_admin
            - trainer
            - member
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PagedUserCompanyResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserCompanyResponse'
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    PagedMembershipResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipResponse'
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - inviteeUserId
        - role
      properties:
        inviteeUserId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - company_admin
            - trainer
            - member
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - company_admin
            - trainer
            - member
    ReplaceAdminRequest:
      type: object
      additionalProperties: false
      required:
        - outgoingAdminUserId
        - successorUserId
      properties:
        outgoingAdminUserId:
          type: string
          format: uuid
        successorUserId:
          type: string
          format: uuid
        outgoingNewRole:
          type: string
          enum:
            - trainer
            - member
          default: member
    InvitationResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - companyId
        - inviteeUserId
        - role
        - status
        - expiresAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        inviteeUserId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - company_admin
            - trainer
            - member
        status:
          type: string
          enum:
            - pending
            - accepted
            - declined
            - revoked
        expiresAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PagedInvitationResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - limit
        - offset
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvitationResponse'
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
    ReplaceAdminResponse:
      type: object
      additionalProperties: false
      required:
        - outgoingMembership
        - successorMembership
      properties:
        outgoingMembership:
          $ref: '#/components/schemas/MembershipResponse'
        successorMembership:
          $ref: '#/components/schemas/MembershipResponse'
    PlatformCreateCompanyRequest:
      type: object
      additionalProperties: false
      required:
        - slug
        - name
        - initialAdminUserId
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          description: Identificador único legible de la empresa (minúsculas, dígitos y guiones simples).
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nombre visible de la empresa.
        initialAdminUserId:
          type: string
          format: uuid
          description: UUID canónico del usuario verificado con perfil existente que será designado primer `company_admin` activo.
    PlatformCreateCompanyResponse:
      type: object
      additionalProperties: false
      required:
        - company
        - initialAdminMembership
        - idempotencyReplayed
      properties:
        company:
          $ref: '#/components/schemas/CompanyResponse'
        initialAdminMembership:
          $ref: '#/components/schemas/MembershipResponse'
        idempotencyReplayed:
          type: boolean
          description: Indica si la respuesta proviene de una repetición idempotente de una creación ya confirmada.
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          nullable: true
        details:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
